# Configuração da Friday

# Escada de modelos: a Friday tenta na ordem; quando a cota diária de um
# esgota (em todas as chaves de API), desce para o próximo.
models:
  - gemini-2.5-flash
  - gemini-2.5-flash-lite
timezone: America/Sao_Paulo
history_max_turns: 40          # janela de contexto da conversa

# Máquinas que a Friday pode controlar por SSH.
# Requer chave SSH do servidor autorizada em cada máquina (guia no README).
machines:
  # mac:
  #   host: 192.168.0.10
  #   user: jvfs
  # pc:
  #   host: 192.168.0.11
  #   user: jvfs
  #   mac_address: "AA:BB:CC:DD:EE:FF"   # para Wake-on-LAN ("liga meu PC")

# Monitores de eventos: checagens baratas (sem IA) em intervalos; a Friday só
# te avisa quando o estado MUDA (ok → problema e problema → ok).
monitors:
  disco-cheio:
    check: disk              # alerta quando o disco passa do limite
    path: /
    threshold_percent: 90
    interval_minutes: 60
  # servico-docker:          # alerta quando um comando falha (código != 0)
  #   check: command
  #   command: systemctl is-active docker
  #   interval_minutes: 5
  # pc-ligou:                # alerta quando uma máquina fica online/offline
  #   check: ping
  #   host: 192.168.0.11
  #   alert_when: online     # ou "offline" (padrão)
  #   interval_minutes: 5

# Rotinas proativas: cron → instrução. O resultado chega no Telegram.
routines:
  resumo-matinal:
    cron: "0 8 * * *"
    prompt: >
      Faça meu resumo matinal: previsão do tempo para hoje na minha cidade,
      as 3 principais manchetes do Brasil e do mundo, meus compromissos de
      hoje na agenda e emails não lidos importantes (se você tiver essas
      ferramentas disponíveis), e qualquer lembrete que você tenha anotado
      na memória para hoje. Seja concisa.
