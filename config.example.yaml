# Configuração da Friday

# Escada de modelos: a Friday tenta na ordem; quando a cota diária de um
# esgota (em todas as chaves de API), desce para o próximo.
models:
  - gemini-3.5-flash
  - gemini-3.5-flash-lite
timezone: America/Sao_Paulo
history_max_turns: 40          # janela de contexto da conversa

# Horário de silêncio: avisos proativos não-críticos ficam guardados e chegam
# juntos de manhã. Monitores com `critical: true` furam o silêncio.
quiet_hours:
  inicio: "23:00"
  fim: "07:00"

# Backups (descomente e ajuste o destino; rotina diária mais abaixo)
# backup_dir: /home/jvfs/backups-friday

# Voz na sala (ligar SÓ no servidor/notebook — precisa de mic e alto-falante)
voice:
  enabled: true
  wake_threshold: 0.5          # sensibilidade da wake word (0-1)
  silence_seconds: 0.9         # silêncio que encerra a fala
  # Motor de voz: auto (nuvem, cai para espeak sem internet) | edge | espeak | piper
  # No servidor antigo: edge ~1,4s por frase, espeak ~0,2s, piper ~13s (inviável)
  tts_backend: auto
  # edge_voice: pt-BR-AntonioNeural    # vozes: ...AntonioNeural, ...FranciscaNeural
  # espeak_speed: 165                  # palavras por minuto da voz reserva
  # piper_voice: pt_BR-faber-medium
  # input_device: null         # dispositivo de captura (padrão do sistema)

# Máquinas que a Friday pode controlar por SSH.
# Requer chave SSH do servidor autorizada em cada máquina (guia no README).
machines:
  mac:
    host: 100.70.155.0
    user: jvfs
  # pc:
  #   host: 192.168.0.11
  #   user: jvfs
  #   mac_address: "AA:BB:CC:DD:EE:FF"   # para Wake-on-LAN ("liga meu PC")

# Monitores de eventos: checagens baratas (sem IA) em intervalos; a Friday só
# te avisa quando o estado MUDA (ok → problema e problema → ok).
monitors:
  disco-cheio:
    check: disk              # alerta quando o disco passa do limite
    path: /
    threshold_percent: 90
    interval_minutes: 60
  # servico-docker:          # alerta quando um comando falha (código != 0)
  #   check: command
  #   command: systemctl is-active docker
  #   interval_minutes: 5
  # pc-ligou:                # alerta quando uma máquina fica online/offline
  #   check: ping
  #   host: 192.168.0.11
  #   alert_when: online     # ou "offline" (padrão)
  #   interval_minutes: 5
  # chegada-em-casa:         # requer Home Assistant + app companion no celular
  #   check: ha_state
  #   entity: person.joao_vitor
  #   to: home
  #   from: not_home         # só dispara na TRANSIÇÃO (não no boot já em casa)
  #   notify_recovery: false
  #   interval_minutes: 2
  # saiu-do-trabalho:        # requer zona "Trabalho" desenhada no HA
  #   check: ha_state
  #   entity: person.joao_vitor
  #   to: not_home
  #   from: Trabalho
  #   notify_recovery: false
  #   interval_minutes: 2
  # reclamacoes-clientes:    # dispara o pipeline da reclamação (Fase F)
  #   check: gmail
  #   query: "is:unread label:suporte"     # sintaxe de busca do Gmail
  #   account: principal
  #   pipeline: reclamacao
  #   interval_minutes: 5
  # pasta-entrada-drive:     # joga um PDF lá e ele lê e resume
  #   check: drive_folder
  #   folder_id: COLE_O_ID_DA_PASTA
  #   account: principal
  #   interval_minutes: 10
  # ci-quebrou:              # build falhou -> escada de urgência
  #   check: command
  #   command: cd ~/repos/projeto && gh run list -L 1 --json conclusion -q '.[0].conclusion' | grep -qv failure
  #   urgency: high
  #   interval_minutes: 15
  # porta-com-casa-vazia:    # exemplo com condição extra e alerta crítico
  #   check: ha_state
  #   entity: binary_sensor.porta_entrada
  #   to: "on"
  #   only_if: {entity: person.joao_vitor, state: not_home}
  #   critical: true         # fura o horário de silêncio
  #   interval_minutes: 1

# Rotinas proativas: cron → instrução. O resultado chega no Telegram.
routines:
  resumo-matinal:
    cron: "0 8 * * *"
    prompt: >
      Faça meu resumo matinal: primeiro descubra onde estou (home_state de
      person.*; se eu não estiver em casa, use as coordenadas do meu
      device_tracker) e traga a previsão do tempo DO LUGAR onde estou.
      Depois: as 3 principais manchetes do Brasil e do mundo, meus
      compromissos de hoje na agenda, emails não lidos importantes e
      qualquer lembrete anotado na memória para hoje. Seja conciso.
  # backup-diario:             # requer backup_dir configurado acima
  #   cron: "30 4 * * *"
  #   prompt: >
  #     Rode o backup: execute `bash scripts/backup.sh <backup_dir>` na pasta
  #     da Friday e me avise apenas se algo der errado.
  # resumo-do-dia:             # o que foi codado hoje (Fase G)
  #   cron: "0 20 * * 1-5"
  #   prompt: >
  #     Rode `git log --since=today --oneline` em cada projeto da minha lista
  #     (use run_on_machine na máquina certa) e me faça um resumo do que
  #     avançou hoje. Se não houve commits, diga só isso.
  # transito-manha:            # exemplo de rotina condicional (requer HA)
  #   cron: "40 7 * * 1-5"
  #   only_if: {entity: person.joao, state: home}
  #   prompt: Como está o trânsito daqui para o trabalho agora?

# Projetos que o agente de código pode tocar (LISTA FECHADA — ele recusa
# qualquer projeto fora daqui). Sempre trabalha em branch novo, nunca dá push.
# code_projects:
#   friday:
#     machine: mac
#     path: /Users/jvfs/Documents/repos/Friday

# Agentes de código disponíveis no Mac e a ordem de preferência.
# code:
#   order: [claude, antigravity]
#   agents:                      # sobrescreve os padrões se precisar
#     claude: claude -p {tarefa} --permission-mode acceptEdits
#     antigravity: agy -p {tarefa} --mode accept-edits

# Servidores MCP plugáveis: qualquer servidor Model Context Protocol vira
# ferramenta do JARVIS (requer: pip install -e ".[mcp]"). Segredos ficam no
# .env — o servidor filho herda o ambiente do JARVIS automaticamente.
# mcp_servers:
#   openfinance:               # github.com/meloluan/openfinance-analyst
#     command: node
#     args: [/home/jarvis/openfinance-analyst/dist/index.js]

# Servidor web interno (webhooks de ligação e do sistema de suporte).
# Publique com: tailscale funnel --bg 8765   (não abra porta no roteador!)
# web:
#   port: 8765
#   public_url: https://jarvis.SEU-TAILNET.ts.net
#   voice: Polly.Vitoria-Neural     # voz da Twilio nas ligações
