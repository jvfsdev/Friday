[project]
name = "friday"
version = "0.1.0"
description = "Friday — assistente pessoal autônoma auto-hospedada (estilo JARVIS)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10,<4",
    "asyncssh>=2.14",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
# Navegador de verdade (pesado): pip install -e ".[browser]" && playwright install chromium
browser = ["playwright>=1.45"]
# Voz na sala (instalar no servidor): mic + wake word + reprodução
voice = ["openwakeword>=0.6", "onnxruntime", "sounddevice", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["friday", "friday.tools"]
