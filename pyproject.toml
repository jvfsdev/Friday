[project]
name = "friday"
version = "0.1.0"
description = "Friday — assistente pessoal autônoma auto-hospedada (estilo JARVIS)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10,<4",
    "asyncssh>=2.14",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "msal>=1.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["friday", "friday.tools"]
